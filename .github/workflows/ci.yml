name: "CI"
on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize]
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 10
    - uses: actions/setup-go@v5
      with:
        go-version: 1.22
    - uses: ./
      id: coverage
      with:
        working-directory: test-go-module
        coverage-threshold: 0
        cover-pkg: ./...
    - if: steps.coverage.outputs.coverage-pct < 40
      uses: actions/github-script@v7
      with:
        script: |
          core.setFailed('Incorrect coverage-pct: ${{ steps.coverage.outputs.coverage-pct }}')
    - if: steps.coverage.outputs.coverage-pct-0dp != '67'
      uses: actions/github-script@v7
      with:
        script: |
          core.setFailed('Incorrect coverage-pct-0dp: ${{ steps.coverage.outputs.coverage-pct-0dp }}')
    - if: steps.coverage.outputs.coverage-pct-1dp != '66.7'
      uses: actions/github-script@v7
      with:
        script: |
          core.setFailed('Incorrect coverage-pct-1dp: ${{ steps.coverage.outputs.coverage-pct-1dp }}')

  check-dist:
    name: Check dist dir
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist directory
        run: npm run prepare

      - name: Compare dist directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi
        id: diff

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create config
        run: |
          cat <<EOF > .releaserc.json
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
