name: Compliance
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-title:
    name: Check title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          REGEX='^(feat|fix)(\([^)]+\)): [a-z].+$'
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "Error: PR title must follow conventional commit format:"
            echo "See: https://www.conventionalcommits.org/"
            echo "Format: <type>(<scope>): <description>"
            echo "- Must be a conventional commit"
            echo "- Must use type 'feat' or 'fix'"
            echo "- Must include a scope (e.g., 'feat(scope): description')"
            echo "- Message must start lowercase"
            exit 1
          fi

